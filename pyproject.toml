[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "psa"
version = "1.1"
description = "Pulse Sequence Analyzer: space-curve analysis of NMR pulse sequences"
requires-python = ">=3.8,<3.14"  # PySide6<6.10 has no wheels for 3.14+
dependencies = [
    "numpy",
    "scipy",
    "matplotlib",
    "mplcursors",
    "mpld3",
    "PySide6<6.10",  # 6.10+ needs macOS >= 14.4
    "dash",
    "plotly",
]

[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools.packages.find]
where = ["."]
include = ["psa*"]
